<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS Hub</title>
<meta name="description" content="NEXUS Hub: one dashboard for all your apps. Bibley, nortest, NEXUS Calendar, NEXUS News, Ultimate Weather and Apologetics101.">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="NEXUS Hub">
<meta property="og:description" content="All your apps, one dashboard.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ptr" class="ptr" aria-hidden="true"><span class="ptr-spin"></span><span id="ptrText">Pull to refresh</span></div>
<header class="top">
  <div class="bar">
    <div class="brand"><img src="icons/favicon-32.png" alt="" width="28" height="28"><h1>NEXUS <span>Hub</span></h1></div>
    <div class="actions">
      <button id="installBtn" class="install" hidden>⬇ Install app</button>
      <button id="refreshBtn" class="icon-btn" aria-label="Refresh stats"><span id="refreshIco">⟳</span></button>
      <button id="setBtn" class="icon-btn" data-act="settings" aria-label="Hub settings: cards, backup, snapshots">⚙️</button>
    </div>
  </div>
  <div class="status"><span id="dot" class="dot"></span><span id="updated">Loading your stats…</span></div>
</header>
<div id="offline" class="offline" hidden>You're offline. Showing your last stats.</div>
<main id="main" tabindex="-1">
  <section class="hello"><p id="greet" class="greet">Hey Oliver 👋</p><div id="summary" class="summary" aria-label="Summary"></div>
    <nav class="quick" aria-label="Quick actions">
      <button type="button" class="qa-btn" data-act="nt-toggle"><span>⏯</span>Music</button>
      <button type="button" class="qa-btn" data-act="qa-event"><span>＋</span>Event</button>
      <button type="button" class="qa-btn" data-act="bib-done"><span>✓</span>Reading</button>
      <button type="button" class="qa-btn" data-act="qa-backup"><span>💾</span>Backup</button>
    </nav></section>
  <section id="cards" class="cards" aria-live="polite"></section>
</main>
<footer class="foot">Stats are read from this phone only. Nothing leaves your device except music-remote commands.<br>Every change the Hub makes has Undo, and ⚙️ keeps snapshots.</footer>
<div id="toast" class="toast" role="status" hidden></div>
<script src="controls.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
